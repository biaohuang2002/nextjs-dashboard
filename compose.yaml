services:
  # Application service. The `target: dev` line builds the development
  # image (includes tsx and dev tooling); the runner stage of the
  # Dockerfile is unused in development.
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    environment:
      - POSTGRES_HOST=db
#      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
      - POSTGRES_URL=postgres://postgres:postgres@localhost:5432/nextjs-dashboard-postgres
      - POSTGRES_URL_NON_POOLING=postgres://postgres:postgres@localhost:5432/nextjs-dashboard-postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=nextjs-dashboard-postgres
      - AUTH_SECRET=eBhOkLd6RPeQu45XpE13r/ivT4pMGN8vmNDR/ycek3s=
      - AUTH_URL=http://localhost:3000/api/auth
    depends_on:
      db:
        condition: service_healthy
#    secrets:
#      - db-password

#  # Database service. Reads the password from a Docker secret mounted at
#  # /run/secrets/db-password. Compose waits for the healthcheck to pass
#  # before starting the server, via the server's depends_on.
#  db:
#    image: postgres:18
#    restart: always
#    user: postgres
#    secrets:
#      - db-password
#    volumes:
#      - db-data:/var/lib/postgresql
#    environment:
#      - POSTGRES_DB=nextjs-dashboard-postgres
#      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
#    expose:
#      - 5432
#    healthcheck:
#      test: ["CMD", "pg_isready"]
#      interval: 10s
#      timeout: 5s
#      retries: 5

  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: my_postgres_db
    restart: always
    user: postgres
#    secrets:
#      - db-password
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=nextjs-dashboard-postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
